[project]
name = "triage"
version = "0.1.0"
description = "Triagem automática de urgência em laudos médicos — API de inferência, pipeline de treino e stack de observabilidade"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Luisa", email = "luisa@harpia.tech" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "joblib>=1.4",
    "prometheus-client>=0.21",
    "onnxruntime>=1.20",
    "skl2onnx>=1.17",
]

[project.optional-dependencies]
data = ["kagglehub>=0.3"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triage"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "D",   # pydocstyle
]
ignore = [
    "D203", # conflita com D211
    "D213", # conflita com D212
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D103", "D100"]
"dags/*" = ["D100"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"

[tool.coverage.run]
source = ["src/triage"]
omit = ["*/__init__.py"]
